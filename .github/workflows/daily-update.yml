name: Daily news & briefing update

on:
  schedule:
    # 21:00 UTC = 06:00 KST (다음날). GitHub Actions 스케줄은 UTC 기준입니다.
    - cron: '0 21 * * *'
  workflow_dispatch: {}   # Actions 탭에서 수동으로 "Run workflow" 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run daily update script (GNews + Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: node scripts/update-daily.mjs

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily.json
          if git diff --cached --quiet; then
            echo "변경 사항 없음, 커밋 생략"
          else
            git commit -m "chore: 데일리 뉴스·브리핑 자동 갱신 [skip ci]"
            git push
          fi
